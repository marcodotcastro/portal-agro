default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "volt-shared-postgres") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "portal_agro") %>
  password: <%= ENV.fetch("DB_PASSWORD", "volt_portal_agro_pass_2026") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "portal_agro_development") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "portal_agro_test") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "portal_agro_production") %>
  host: <%= ENV.fetch("DB_HOST", "volt-shared-postgres") %>
  username: <%= ENV.fetch("DB_USERNAME", "portal_agro") %>
  password: <%= ENV.fetch("DB_PASSWORD", "volt_portal_agro_pass_2026") %>
